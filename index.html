<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>لولو ماركت | متجرك للمواد الغذائية المجمدة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#D62828', secondary: '#2E7D32', background: '#F7F8FA' },
          boxShadow: { 'premium': '0 10px 40px -10px rgba(0,0,0,0.1)', 'btn': '0 4px 15px -3px rgba(214,40,40,0.4)' }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-background dark:bg-slate-950">
  <div id="root"></div>

  <script src="products.js"></script>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        cart: <path d="M6 6h15l-1.5 9h-12L5 3H2m3 18a1 1 0 100 2 1 1 0 000-2zm13 0a1 1 0 100 2 1 1 0 000-2z" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
        search: <><circle cx="11" cy="11" r="8" strokeWidth="2" stroke="currentColor" fill="none"/><path d="M21 21l-4.35-4.35" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round"/></>,
        plus: <path d="M12 5v14m-7-7h14" strokeWidth="2.5" stroke="currentColor" fill="none" strokeLinecap="round"/>,
        minus: <path d="M5 12h14" strokeWidth="2.5" stroke="currentColor" fill="none" strokeLinecap="round"/>,
        trash: <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
        star: <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" strokeWidth="0" fill="currentColor"/>,
        heart: <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" strokeWidth="2" stroke="currentColor" fill="none"/>,
        whatsapp: <path d="M17.6 6.32A7.85 7.85 0 0012.05 4a7.94 7.94 0 00-6.88 11.9L4 20l4.2-1.1a7.9 7.9 0 003.8.97h.01a7.94 7.94 0 005.6-13.55zM12.02 18.5h-.01a6.6 6.6 0 01-3.36-.92l-.24-.14-2.49.65.67-2.43-.16-.25a6.55 6.55 0 011.32-8.04 6.55 6.55 0 019.14 9.4 6.55 6.55 0 01-4.87 1.73zm3.6-4.9c-.2-.1-1.17-.58-1.35-.64-.18-.07-.31-.1-.45.1-.13.2-.51.64-.63.78-.11.13-.23.15-.43.05-.2-.1-.84-.31-1.6-.99-.6-.53-1-1.18-1.12-1.38-.11-.2-.01-.31.09-.41.09-.09.2-.23.3-.35.1-.12.13-.2.2-.33.06-.13.03-.25-.02-.35-.05-.1-.45-1.08-.62-1.48-.16-.39-.33-.34-.45-.34l-.38-.01c-.13 0-.35.05-.53.25s-.7.68-.7 1.65.72 1.92.82 2.05c.1.13 1.4 2.14 3.4 3 .47.2.84.32 1.13.41.48.15.91.13 1.25.08.38-.06 1.17-.48 1.34-.94.17-.46.17-.86.12-.94-.05-.08-.18-.13-.38-.23z" strokeWidth="0" fill="currentColor"/>,
        check: <path d="M20 6L9 17l-5-5" strokeWidth="3" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
        moon: <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
        sun: <><circle cx="12" cy="12" r="5" strokeWidth="2" stroke="currentColor" fill="none"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round"/></>,
        home: <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
        flame: <path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
        chevronRight: <path d="M9 18l6-6-6-6" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
        close: <path d="M18 6L6 18M6 6l12 12" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
        mapPin: <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/><circle cx="12" cy="10" r="3" strokeWidth="2" stroke="currentColor" fill="none"/></>,
        sliders: <path d="M4 21v-7m0-8V3m8 18v-9m0-8V3m8 18v-5m0-8V3M1 14h6m2-6h6m2 8h6" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
        truck: <path d="M1 3h15v13H1z M16 8h4l3 3v5h-7" strokeWidth="2" stroke="currentColor" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      };
      return <svg viewBox="0 0 24 24" className={className} style={{display:'inline-block'}}>{icons[name]}</svg>;
    };

    const formatCurrency = (amount) => `${amount.toFixed(2)} ج.م`;

    const Header = ({ cartCount, darkMode, setDarkMode, onCartClick, showMobileSearch, setShowMobileSearch, searchQuery, setSearchQuery }) => (
      <header className="sticky top-0 z-40 glass">
        <div className="container mx-auto p-4 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-primary to-red-700 flex items-center justify-center text-white shadow-btn text-xl">❄️</div>
            <div className="text-right">
              <h1 className="text-lg font-black text-slate-900 dark:text-white leading-none">لولو ماركت</h1>
              <div className="hidden sm:flex items-center gap-1 text-xs text-slate-500 dark:text-slate-400 mt-1">
                <Icon name="mapPin" className="w-3 h-3 text-secondary" />
                <span>التوصيل إلى: القاهرة، مدينة نصر</span>
              </div>
            </div>
          </div>
          
          <div className="flex-1 max-w-xl relative hidden md:block">
            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" /></span>
            <input 
              type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
              placeholder="ابحث عن منتجاتك المفضلة..." 
              className="w-full bg-slate-100/80 dark:bg-slate-800 border border-transparent focus:border-primary rounded-full py-3 pr-12 pl-4 text-sm outline-none transition-all dark:text-white"
            />
          </div>

          <div className="flex items-center gap-2">
            <button onClick={() => setShowMobileSearch(!showMobileSearch)} className="md:hidden p-3 bg-slate-100 dark:bg-slate-800 rounded-2xl text-slate-700 dark:text-white">
              <Icon name="search" />
            </button>
            <button onClick={() => setDarkMode(!darkMode)} className="p-3 bg-slate-100 dark:bg-slate-800 rounded-2xl text-slate-700 dark:text-yellow-400">
              <Icon name={darkMode ? 'sun' : 'moon'} />
            </button>
            <button onClick={onCartClick} className="relative p-3 bg-white dark:bg-slate-800 rounded-2xl shadow-sm text-slate-700 dark:text-white hover:text-primary">
              <Icon name="cart" className="w-6 h-6" />
              {cartCount > 0 && (
                <span className="absolute -top-1 -left-1 bg-primary text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center anim-scale-in">
                  {cartCount}
                </span>
              )}
            </button>
          </div>
        </div>
        
        {/* Mobile Search Bar */}
        {showMobileSearch && (
          <div className="md:hidden container mx-auto px-4 pb-4 anim-slide-up">
            <div className="relative">
              <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" /></span>
              <input 
                type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="ابحث هنا..." autoFocus
                className="w-full bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-primary rounded-full py-3 pr-12 pl-4 text-sm outline-none dark:text-white"
              />
            </div>
          </div>
        )}
      </header>
    );

    const BottomNav = ({ active, onHome, onSearch, onFav, onCart, cartCount, favCount }) => (
      <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 glass flex justify-around p-2 pb-3 shadow-premium">
        <button onClick={onHome} className={`flex flex-col items-center ${active === 'home' ? 'text-primary' : 'text-slate-400'}`}>
          <Icon name="home" /><span className="text-[10px] mt-1">الرئيسية</span>
        </button>
        <button onClick={onSearch} className={`flex flex-col items-center ${active === 'search' ? 'text-primary' : 'text-slate-400'}`}>
          <Icon name="search" /><span className="text-[10px] mt-1">بحث</span>
        </button>
        <button onClick={onFav} className={`flex flex-col items-center relative ${active === 'fav' ? 'text-primary' : 'text-slate-400'}`}>
          <Icon name="heart" />
          {favCount > 0 && <span className="absolute -top-1 -right-2 bg-primary text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">{favCount}</span>}
          <span className="text-[10px] mt-1">المفضلة</span>
        </button>
        <button onClick={onCart} className="flex flex-col items-center text-slate-400 relative">
          <Icon name="cart" />
          {cartCount > 0 && <span className="absolute -top-1 -right-2 bg-primary text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">{cartCount}</span>}
          <span className="text-[10px] mt-1">السلة</span>
        </button>
      </div>
    );

    const FlashSale = ({ onAddToCart }) => {
      const [time, setTime] = useState({ h: 5, m: 42, s: 18 });
      useEffect(() => {
        const t = setInterval(() => {
          setTime(p => {
            let { h, m, s } = p;
            if (s > 0) s--; else if (m > 0) { m--; s = 59; } else if (h > 0) { h--; m = 59; s = 59; }
            return { h, m, s };
          });
        }, 1000);
        return () => clearInterval(t);
      }, []);
      const pad = n => n.toString().padStart(2, '0');
      const items = productsData.filter(p => p.oldPrice).slice(0, 6);

      return (
        <section className="container mx-auto px-4 mt-8">
          <div className="bg-gradient-to-l from-red-600 via-primary to-red-800 rounded-3xl p-5 shadow-premium relative overflow-hidden">
            <div className="absolute top-0 left-0 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            <div className="flex justify-between items-center mb-6 relative z-10 text-white">
              <div className="flex items-center gap-2">
                <Icon name="flame" className="w-7 h-7 animate-pulse" />
                <div>
                  <h3 className="text-xl font-black">عروض فلاش</h3>
                  <p className="text-xs text-white/80">خصومات حصرية لفترة محدودة</p>
                </div>
              </div>
              <div className="flex items-center gap-1">
                <span className="bg-black/30 rounded-lg p-1.5 w-10 text-center font-bold text-sm">{pad(time.h)}</span>
                <span>:</span>
                <span className="bg-black/30 rounded-lg p-1.5 w-10 text-center font-bold text-sm">{pad(time.m)}</span>
                <span>:</span>
                <span className="bg-black/30 rounded-lg p-1.5 w-10 text-center font-bold text-sm">{pad(time.s)}</span>
              </div>
            </div>
            <div className="flex gap-4 overflow-x-auto no-scrollbar pb-2 relative z-10">
              {items.map(p => (
                <div key={p.id} className="min-w-[160px] bg-white dark:bg-slate-800 rounded-2xl p-2">
                  <img src={p.image} className="w-full h-28 object-cover rounded-xl" alt={p.name} />
                  <h4 className="font-bold text-slate-800 dark:text-white text-xs mt-2 line-clamp-1">{p.name}</h4>
                  <div className="flex items-center justify-between mt-1">
                    <div>
                      <span className="text-primary font-black text-sm block">{formatCurrency(p.price)}</span>
                      <span className="text-slate-400 line-through text-[10px]">{formatCurrency(p.oldPrice)}</span>
                    </div>
                    <button onClick={() => onAddToCart(p.id)} className="bg-secondary text-white p-1.5 rounded-lg hover:bg-green-700">
                      <Icon name="plus" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const ProductCard = ({ product, onAddToCart, onCardClick, isFav, onFav }) => {
      const discount = product.oldPrice ? Math.round(((product.oldPrice - product.price) / product.oldPrice) * 100) : 0;
      return (
        <div onClick={() => onCardClick(product.id)} className="product-card bg-white dark:bg-slate-800 rounded-3xl p-3 shadow-sm border border-slate-100 dark:border-slate-700/50 cursor-pointer relative overflow-hidden flex flex-col">
          <div className="absolute top-3 right-3 z-10 flex flex-col gap-1">
            {product.isNew && <span className="bg-blue-500 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-sm">جديد</span>}
            {product.isBestSeller && <span className="bg-yellow-400 text-black text-[10px] font-bold px-2 py-1 rounded-full shadow-sm flex items-center gap-1"><Icon name="star" className="w-2 h-2"/> الأكثر مبيعاً</span>}
          </div>
          <button onClick={(e) => { e.stopPropagation(); onFav(product.id); }} className="absolute top-3 left-3 z-10 bg-white/80 dark:bg-slate-900/80 p-2 rounded-full backdrop-blur-sm">
            <Icon name="heart" className={`w-4 h-4 ${isFav ? 'fill-primary text-primary' : 'text-slate-600'}`} />
          </button>
          <div className="relative">
            <img src={product.image} alt={product.name} className="w-full h-44 object-cover rounded-2xl" />
            {discount > 0 && <span className="absolute bottom-2 right-2 bg-primary text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-md">خصم {discount}%</span>}
          </div>
          <div className="flex flex-col mt-3 flex-1">
            <div className="flex items-center gap-1 mb-1">
              <Icon name="star" className="w-3 h-3 text-yellow-400" />
              <span className="text-xs font-bold text-slate-600 dark:text-slate-300">{product.rating}</span>
            </div>
            <h3 className="font-bold text-slate-800 dark:text-white text-sm leading-tight line-clamp-2 h-10">{product.name}</h3>
            <p className="text-slate-400 text-xs mt-1">{product.weight}</p>
            <div className="flex items-center justify-between mt-auto pt-2">
              <div>
                {product.oldPrice && <span className="text-slate-400 text-xs line-through block">{formatCurrency(product.oldPrice)}</span>}
                <span className="text-primary font-black text-lg">{formatCurrency(product.price)}</span>
              </div>
              <button onClick={(e) => { e.stopPropagation(); onAddToCart(product.id); }} className="bg-secondary/10 text-secondary p-2.5 rounded-xl hover:bg-secondary hover:text-white">
                <Icon name="plus" className="w-5 h-5" />
              </button>
            </div>
          </div>
        </div>
      );
    };

    const ProductDetails = ({ product, onAddToCart, onBack, isFav, onFav }) => {
      const [qty, setQty] = useState(1);
      const discount = product.oldPrice ? Math.round(((product.oldPrice - product.price) / product.oldPrice) * 100) : 0;
      const related = productsData.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);

      return (
        <div className="container mx-auto px-4 py-6 pb-24 md:pb-6">
          <button onClick={onBack} className="flex items-center gap-1 text-slate-600 dark:text-slate-300 mb-6 hover:text-primary">
            <Icon name="chevronRight" className="w-5 h-5" /> العودة
          </button>
          <div className="grid md:grid-cols-2 gap-8 bg-white dark:bg-slate-800 p-4 md:p-8 rounded-3xl shadow-sm">
            <img src={product.image} className="w-full h-72 md:h-96 object-cover rounded-2xl" alt={product.name} />
            <div className="flex flex-col">
              <div className="flex items-center gap-2 mb-2">
                <div className="flex items-center gap-1 bg-yellow-50 dark:bg-yellow-900/20 px-2 py-1 rounded-md">
                  <Icon name="star" className="w-3 h-3 text-yellow-400" />
                  <span className="text-xs font-bold text-yellow-600">{product.rating}</span>
                </div>
                <span className="text-xs text-slate-400">{product.weight}</span>
              </div>
              <h1 className="text-2xl md:text-3xl font-black text-slate-900 dark:text-white mb-3">{product.name}</h1>
              <p className="text-slate-500 dark:text-slate-400 text-sm mb-6">{product.description}</p>
              <div className="flex items-center gap-4 mb-6">
                <span className="text-3xl font-black text-primary">{formatCurrency(product.price)}</span>
                {product.oldPrice && (
                  <div className="flex flex-col">
                    <span className="text-slate-400 line-through text-sm">{formatCurrency(product.oldPrice)}</span>
                    <span className="bg-primary/10 text-primary text-xs font-bold px-2 py-0.5 rounded-full text-center">خصم {discount}%</span>
                  </div>
                )}
              </div>
              <div className="flex items-center gap-4 mb-6">
                <div className="flex items-center gap-3 bg-slate-100 dark:bg-slate-700 rounded-2xl p-2">
                  <button onClick={() => setQty(Math.max(1, qty - 1))} className="p-2 bg-white dark:bg-slate-800 rounded-xl shadow-sm"><Icon name="minus" className="w-4 h-4" /></button>
                  <span className="font-bold text-lg w-8 text-center">{qty}</span>
                  <button onClick={() => setQty(qty + 1)} className="p-2 bg-white dark:bg-slate-800 rounded-xl shadow-sm"><Icon name="plus" className="w-4 h-4" /></button>
                </div>
                <button onClick={() => { onAddToCart(product.id, qty); onBack(); }} className="flex-1 bg-primary text-white font-bold py-4 rounded-2xl shadow-btn hover:bg-red-700 flex items-center justify-center gap-2">
                  <Icon name="cart" className="w-5 h-5" /> إضافة للسلة
                </button>
                <button onClick={() => onFav(product.id)} className="p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
                  <Icon name="heart" className={`w-5 h-5 ${isFav ? 'fill-primary text-primary' : ''}`} />
                </button>
              </div>
            </div>
          </div>
          {related.length > 0 && (
            <div className="mt-12">
              <h3 className="text-xl font-bold text-slate-800 dark:text-white mb-4">منتجات ذات صلة</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {related.map(p => <ProductCard key={p.id} product={p} onAddToCart={onAddToCart} onCardClick={() => {}} isFav={false} onFav={() => {}} />)}
              </div>
            </div>
          )}
        </div>
      );
    };

    const CartDrawer = ({ isOpen, onClose, items, onUpdateQty, onRemove, onCheckout }) => {
      const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
      const delivery = subtotal > 0 ? 25 : 0;
      const total = subtotal + delivery;
      return (
        <>
          {isOpen && <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50" onClick={onClose}></div>}
          <div className={`fixed top-0 left-0 h-full w-full sm:w-96 bg-white dark:bg-slate-900 z-50 shadow-2xl flex flex-col ${isOpen ? 'anim-cart' : 'hidden'}`}>
            <div className="p-4 border-b dark:border-slate-800 flex items-center justify-between">
              <h3 className="text-lg font-black flex items-center gap-2 dark:text-white"><Icon name="cart" className="w-6 h-6 text-primary"/> سلة التسوق ({items.length})</h3>
              <button onClick={onClose} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full"><Icon name="close" /></button>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-background dark:bg-slate-950 no-scrollbar">
              {items.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-full text-center text-slate-400">
                  <div className="w-24 h-24 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-4 text-4xl">🛒</div>
                  <p className="font-bold text-lg text-slate-600 dark:text-slate-300">سلتك فارغة</p>
                  <button onClick={onClose} className="mt-6 bg-primary text-white font-bold py-2 px-6 rounded-full text-sm">تصفح المنتجات</button>
                </div>
              ) : (
                items.map(item => (
                  <div key={item.id} className="bg-white dark:bg-slate-800 rounded-2xl p-3 flex gap-3 shadow-sm">
                    <img src={item.image} className="w-20 h-20 rounded-xl object-cover" alt={item.name} />
                    <div className="flex-1 flex flex-col">
                      <div className="flex justify-between items-start">
                        <h4 className="font-bold text-slate-800 dark:text-white text-sm">{item.name}</h4>
                        <button onClick={() => onRemove(item.id)} className="text-slate-300 hover:text-red-500"><Icon name="trash" className="w-4 h-4" /></button>
                      </div>
                      <span className="text-xs text-slate-400 mb-2">{item.weight}</span>
                      <div className="flex justify-between items-center mt-auto">
                        <div className="flex items-center gap-2 bg-slate-100 dark:bg-slate-700 rounded-lg p-1">
                          <button onClick={() => onUpdateQty(item.id, -1)} className="p-1 hover:bg-white dark:hover:bg-slate-800 rounded"><Icon name="minus" className="w-3 h-3" /></button>
                          <span className="font-bold text-sm w-4 text-center dark:text-white">{item.qty}</span>
                          <button onClick={() => onUpdateQty(item.id, 1)} className="p-1 hover:bg-white dark:hover:bg-slate-800 rounded"><Icon name="plus" className="w-3 h-3" /></button>
                        </div>
                        <span className="text-primary font-black text-sm">{formatCurrency(item.price * item.qty)}</span>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
            {items.length > 0 && (
              <div className="p-4 bg-white dark:bg-slate-900 border-t dark:border-slate-800 space-y-3">
                <div className="flex justify-between text-sm text-slate-500 dark:text-slate-400"><span>المجموع الفرعي</span> <span className="dark:text-white">{formatCurrency(subtotal)}</span></div>
                <div className="flex justify-between text-sm text-slate-500 dark:text-slate-400"><span>رسوم التوصيل</span> <span className="dark:text-white">{formatCurrency(delivery)}</span></div>
                <div className="flex justify-between pt-3 border-t border-dashed"><span className="font-bold dark:text-white">الإجمالي</span> <span className="font-black text-primary text-lg">{formatCurrency(total)}</span></div>
                <button onClick={onCheckout} className="w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-btn hover:bg-red-700 mt-2">إتمام الطلب</button>
              </div>
            )}
          </div>
        </>
      );
    };

    const CheckoutPage = ({ items, onBack, onConfirm }) => {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');
      const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
      const total = subtotal + 25;

      return (
        <div className="container mx-auto px-4 py-6 pb-24 md:pb-6">
          <button onClick={onBack} className="flex items-center gap-1 text-slate-600 dark:text-slate-300 mb-6 hover:text-primary">
            <Icon name="chevronRight" className="w-5 h-5" /> العودة للسلة
          </button>
          <div className="grid lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2 space-y-6">
              <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm">
                <h2 className="text-xl font-bold dark:text-white mb-4 flex items-center gap-2"><Icon name="mapPin" className="text-primary" /> معلومات التوصيل</h2>
                <div className="grid sm:grid-cols-2 gap-4">
                  <input value={name} onChange={e => setName(e.target.value)} placeholder="الاسم الكامل" className="bg-slate-100 dark:bg-slate-700 rounded-xl p-3 outline-none focus:ring-2 focus:ring-primary text-sm dark:text-white" />
                  <input value={phone} onChange={e => setPhone(e.target.value)} type="tel" placeholder="رقم الجوال" className="bg-slate-100 dark:bg-slate-700 rounded-xl p-3 outline-none focus:ring-2 focus:ring-primary text-sm dark:text-white" />
                </div>
                <input value={address} onChange={e => setAddress(e.target.value)} placeholder="العنوان بالتفصيل" className="w-full mt-4 bg-slate-100 dark:bg-slate-700 rounded-xl p-3 outline-none focus:ring-2 focus:ring-primary text-sm dark:text-white" />
              </div>
              <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm">
                <h2 className="text-xl font-bold dark:text-white mb-4">💳 طريقة الدفع</h2>
                <div className="border-2 border-secondary bg-secondary/5 rounded-2xl p-4 flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-secondary/20 flex items-center justify-center text-secondary"><Icon name="truck" /></div>
                  <div className="flex-1"><h3 className="font-bold text-sm dark:text-white">الدفع عند الاستلام</h3><p className="text-xs text-slate-500">ادفع نقداً للمندوب</p></div>
                  <Icon name="check" className="text-secondary w-6 h-6" />
                </div>
              </div>
            </div>
            <div className="lg:col-span-1">
              <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm sticky top-24">
                <h2 className="text-xl font-bold dark:text-white mb-4">ملخص الطلب</h2>
                <div className="space-y-3 max-h-64 overflow-y-auto mb-4 no-scrollbar">
                  {items.map(item => (
                    <div key={item.id} className="flex gap-3 items-center text-sm dark:text-white">
                      <div className="relative">
                        <img src={item.image} className="w-14 h-14 rounded-xl object-cover" alt={item.name} />
                        <span className="absolute -top-1 -right-1 bg-primary text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center">{item.qty}</span>
                      </div>
                      <div className="flex-1"><h4 className="font-medium line-clamp-1">{item.name}</h4><p className="text-slate-400 text-xs">{formatCurrency(item.price)}</p></div>
                      <span className="font-bold">{formatCurrency(item.price * item.qty)}</span>
                    </div>
                  ))}
                </div>
                <div className="border-t dark:border-slate-700 pt-4 space-y-2">
                  <div className="flex justify-between text-sm text-slate-500 dark:text-slate-400"><span>المجموع</span><span>{formatCurrency(subtotal)}</span></div>
                  <div className="flex justify-between text-sm text-slate-500 dark:text-slate-400"><span>التوصيل</span><span>25.00 ج.م</span></div>
                  <div className="flex justify-between pt-2 mt-2 border-t border-dashed dark:border-slate-700"><span className="font-bold dark:text-white">الإجمالي</span> <span className="font-black text-primary text-lg">{formatCurrency(total)}</span></div>
                </div>
                <button onClick={() => { if(!name || !phone || !address) return alert("أكمل البيانات"); onConfirm({name, phone, address}); }} className="w-full mt-6 bg-primary text-white font-bold py-4 rounded-2xl shadow-btn hover:bg-red-700 flex items-center justify-center gap-2">
                  <Icon name="whatsapp" className="w-5 h-5" /> تأكيد الطلب
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [darkMode, setDarkMode] = useState(false);
      const [cart, setCart] = useState({});
      const [favs, setFavs] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [view, setView] = useState('home'); // home, product, checkout, success
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('all');
      const [maxPrice, setMaxPrice] = useState(350);
      const [bestOnly, setBestOnly] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [showMobileSearch, setShowMobileSearch] = useState(false);
      const [showFavsOnly, setShowFavsOnly] = useState(false);
      const [activeNav, setActiveNav] = useState('home');

      useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);

      const addToast = (msg) => {
        const id = Date.now();
        setToasts(t => [...t, { id, msg }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
      };

      const handleAddToCart = (id, qty = 1) => {
        setCart(p => ({ ...p, [id]: (p[id] || 0) + qty }));
        addToast('تمت الإضافة للسلة بنجاح');
      };

      const handleFav = (id) => {
        setFavs(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);
      };

      const cartItems = Object.entries(cart).map(([id, qty]) => ({ ...productsData.find(p => p.id === id), qty }));
      const cartCount = cartItems.reduce((s, i) => s + i.qty, 0);

      const filteredProducts = useMemo(() => {
        return productsData.filter(p => 
          (activeCategory === 'all' || p.category === activeCategory) &&
          p.price <= maxPrice &&
          (!bestOnly || p.isBestSeller) &&
          (searchQuery === '' || p.name.includes(searchQuery)) &&
          (!showFavsOnly || favs.includes(p.id))
        );
      }, [activeCategory, maxPrice, bestOnly, searchQuery, showFavsOnly, favs]);

      const handleConfirmOrder = (data) => {
        const phone = "201146476993"; // رقم الواتساب المطلوب
        let msg = `🛒 *طلب جديد من لولو ماركت*\n\n👤 *الاسم:* ${data.name}\n📱 *الجوال:* ${data.phone}\n📍 *العنوان:* ${data.address}\n\n*تفاصيل الطلب:*\n`;
        cartItems.forEach((i, idx) => { msg += `${idx+1}. ${i.name} (${i.weight})\n   الكمية: ${i.qty} × ${formatCurrency(i.price)} = *${formatCurrency(i.price * i.qty)}*\n`; });
        msg += `\n*---------------------*\n💵 المجموع: ${formatCurrency(cartItems.reduce((s,i)=>s+i.price*i.qty,0))}\n🚚 التوصيل: 25.00 ج.م\n💰 *الإجمالي: ${formatCurrency(cartItems.reduce((s,i)=>s+i.price*i.qty,0) + 25)}*`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        setCart({});
        setView('success');
      };

      return (
        <div className="min-h-screen pb-20 md:pb-0">
          {/* Toasts */}
          <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className="anim-slide-up bg-secondary text-white p-4 rounded-2xl shadow-premium flex items-center gap-3 pointer-events-auto">
                <Icon name="check" className="w-5 h-5" /> <span className="text-sm font-medium">{t.msg}</span>
              </div>
            ))}
          </div>

          <Header 
            cartCount={cartCount} darkMode={darkMode} setDarkMode={setDarkMode}
            onCartClick={() => setIsCartOpen(true)} 
            showMobileSearch={showMobileSearch} setShowMobileSearch={setShowMobileSearch}
            searchQuery={searchQuery} setSearchQuery={setSearchQuery}
          />

          {view === 'home' && (
            <>
              <div className="container mx-auto px-4 mt-6">
                <div className="relative h-56 md:h-72 rounded-3xl overflow-hidden shadow-premium bg-gradient-to-l from-primary to-red-800 flex items-center p-8 md:p-12">
                  <div className="relative z-10 text-white">
                    <h2 className="text-3xl md:text-4xl font-black mb-2">أطعمة مجمدة فاخرة</h2>
                    <p className="text-white/90 mb-6 text-sm">جودة عالية وطزاجة محفوظة تصلك حتى باب منزلك</p>
                    <button className="bg-white text-primary font-bold py-2 px-6 rounded-full text-sm">تسوق الآن</button>
                  </div>
                  <div className="absolute top-4 left-4 text-white/10 text-9xl">❄️</div>
                </div>
              </div>

              <FlashSale onAddToCart={handleAddToCart} />

              {/* Filters Section - Fixed Layout */}
              <div className="container mx-auto px-4 mt-8">
                <div className="flex items-center gap-2 mb-4">
                  <Icon name="sliders" className="w-5 h-5 text-slate-700 dark:text-white" />
                  <h3 className="text-xl font-bold dark:text-white">تصفية المنتجات</h3>
                </div>
                
                <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-4">
                  {categories.map(c => (
                    <button key={c.id} onClick={() => setActiveCategory(c.id)} className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap ${activeCategory === c.id ? 'bg-primary text-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border'}`}>
                      <span>{c.icon}</span> {c.name}
                    </button>
                  ))}
                </div>

                <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm flex flex-col gap-4 mb-4">
                  <div className="flex items-center gap-3 w-full">
                    <span className="text-sm text-slate-500 dark:text-slate-400 whitespace-nowrap">السعر الأقصى:</span>
                    <input type="range" min="10" max="350" value={maxPrice} onChange={e => setMaxPrice(+e.target.value)} className="flex-1 accent-primary" />
                    <span className="text-sm font-bold text-primary w-20 text-left">{formatCurrency(maxPrice)}</span>
                  </div>
                  <div className="flex items-center justify-between w-full">
                    <button onClick={() => setBestOnly(!bestOnly)} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold ${bestOnly ? 'bg-yellow-100 text-yellow-700' : 'bg-slate-100 dark:bg-slate-700 text-slate-500'}`}>
                      <Icon name="star" className={`w-4 h-4 ${bestOnly ? 'fill-current' : ''}`} /> الأكثر مبيعاً
                    </button>
                    {showFavsOnly && (
                      <button onClick={() => setShowFavsOnly(false)} className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold bg-primary/10 text-primary">
                        <Icon name="heart" className="w-4 h-4 fill-primary" /> إخفاء المفضلة
                      </button>
                    )}
                  </div>
                </div>
              </div>

              <section className="container mx-auto px-4 mt-8">
                <h3 className="text-xl font-bold dark:text-white mb-4">
                  {showFavsOnly ? 'المفضلة' : 'كل المنتجات'} ({filteredProducts.length})
                </h3>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  {filteredProducts.length > 0 ? (
                    filteredProducts.map(p => (
                      <ProductCard key={p.id} product={p} onAddToCart={handleAddToCart} 
                        onCardClick={(id) => { setSelectedProduct(productsData.find(x => x.id === id)); setView('product'); window.scrollTo(0, 0); }}
                        isFav={favs.includes(p.id)} onFav={handleFav}
                      />
                    ))
                  ) : (
                    <div className="col-span-2 md:col-span-4 text-center py-12 text-slate-400">
                      <div className="text-5xl mb-4">{showFavsOnly ? '💔' : '🔍'}</div>
                      <p className="font-bold text-lg">{showFavsOnly ? 'لا توجد منتجات في المفضلة' : 'لا توجد منتجات مطابقة'}</p>
                    </div>
                  )}
                </div>
              </section>
            </>
          )}

          {view === 'product' && selectedProduct && (
            <ProductDetails product={selectedProduct} onAddToCart={handleAddToCart} onBack={() => setView('home')}
              isFav={favs.includes(selectedProduct.id)} onFav={handleFav}
            />
          )}

          {view === 'checkout' && <CheckoutPage items={cartItems} onBack={() => setView('home')} onConfirm={handleConfirmOrder} />}

          {view === 'success' && (
            <div className="container mx-auto px-4 py-20 text-center flex flex-col items-center min-h-[70vh] justify-center">
              <div className="relative w-24 h-24 bg-secondary/20 rounded-full flex items-center justify-center mb-6">
                <div className="w-16 h-16 bg-secondary rounded-full flex items-center justify-center text-white anim-scale-in"><Icon name="check" className="w-10 h-10" /></div>
                <div className="absolute inset-0 bg-secondary rounded-full anim-pulse-ring"></div>
              </div>
              <h2 className="text-3xl font-black dark:text-white mb-2">تم استلام طلبك بنجاح!</h2>
              <p className="text-slate-500 dark:text-slate-400 mb-8">سيتم التواصل معك عبر واتساب لتأكيد الطلب</p>
              <button onClick={() => setView('home')} className="bg-primary text-white font-bold py-3 px-8 rounded-full shadow-btn hover:bg-red-700">العودة للرئيسية</button>
            </div>
          )}

          <CartDrawer isOpen={isCartOpen} onClose={() => setIsCartOpen(false)} items={cartItems}
            onUpdateQty={(id, d) => setCart(p => { const n = (p[id]||0)+d; if(n<=0){const { [id]:_, ...r}=p; return r;} return {...p, [id]:n}; })}
            onRemove={(id) => setCart(p => { const { [id]:_, ...r } = p; return r; })}
            onCheckout={() => { setIsCartOpen(false); setView('checkout'); }}
          />

          {cartCount > 0 && view === 'home' && !isCartOpen && (
            <button onClick={() => setIsCartOpen(true)} className="md:hidden fixed bottom-20 left-1/2 -translate-x-1/2 z-30 bg-primary text-white font-bold py-3 px-8 rounded-full shadow-premium flex items-center gap-2 anim-slide-up">
              <Icon name="cart" className="w-5 h-5" /> عرض السلة ({cartCount})
            </button>
          )}

          <a href="https://wa.me/201146476993" target="_blank" className="fixed bottom-20 md:bottom-6 left-4 z-30 w-14 h-14 bg-green-500 rounded-full shadow-premium flex items-center justify-center text-white hover:bg-green-600">
            <Icon name="whatsapp" className="w-7 h-7" />
          </a>

          <BottomNav 
            active={activeNav}
            onHome={() => { setView('home'); setShowMobileSearch(false); setShowFavsOnly(false); setActiveNav('home'); }}
            onSearch={() => { setShowMobileSearch(!showMobileSearch); setActiveNav('search'); }}
            onFav={() => { setShowFavsOnly(!showFavsOnly); setView('home'); setActiveNav('fav'); }}
            onCart={() => setIsCartOpen(true)}
            cartCount={cartCount} 
            favCount={favs.length} 
          />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
